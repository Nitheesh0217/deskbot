# Deploys the edge function from git, so a deploy never depends on a chat session.
# One-time setup: add a repository secret SUPABASE_ACCESS_TOKEN (Supabase dashboard → Account → Access Tokens).
# Until that secret exists the deploy step is skipped and the workflow still runs the tests.
name: deploy
on:
  push:
    branches: [main]
    paths: ["supabase/functions/**", "tests/**", "package.json"]
  workflow_dispatch: {}
concurrency: { group: deploy-edge-function, cancel-in-progress: false }
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: xevymbzgpcsdhygswxlk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Deploy deskbot-v5
        if: ${{ env.SUPABASE_ACCESS_TOKEN != '' }}
        uses: supabase/setup-cli@v1
        with: { version: latest }
      - name: Push function
        if: ${{ env.SUPABASE_ACCESS_TOKEN != '' }}
        run: supabase functions deploy deskbot-v5 --project-ref "$PROJECT_REF" --no-verify-jwt
      - name: Smoke test (status feed reports the new version)
        if: ${{ env.SUPABASE_ACCESS_TOKEN != '' }}
        run: |
          sleep 20
          curl -fsS "https://$PROJECT_REF.supabase.co/functions/v1/deskbot-v5" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);console.log("live version",j.version);if(!j.version)process.exit(1)})'
