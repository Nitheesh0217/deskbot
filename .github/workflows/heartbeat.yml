# Independent heartbeat: runs on GitHub's servers (no Claude, no laptop).
# Reads the bot's PUBLIC read-only status endpoint and fails (→ GitHub emails you) if the bot is stale.
name: heartbeat
on:
  schedule: [{ cron: "7-57/10 * * * *" }]
  workflow_dispatch: {}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Check DeskBot freshness
        run: node scripts/check_health.mjs
