name: fetch research data
# Downloads public Binance 5m candles for research/backtests and stores them on the `data` branch.
on:
  push:
    branches: [main]
    paths: [".github/workflows/fetch-data.yml", "scripts/fetch_klines.py"]
  schedule:
    - cron: "17 6 1 * *"   # monthly refresh
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/fetch_klines.py BTCUSDT PAXGUSDT 2021-01
      - name: publish to data branch
        run: |
          mkdir /tmp/out && cp data/*.csv.gz /tmp/out/
          git config user.name "deskbot-data" && git config user.email "actions@users.noreply.github.com"
          git checkout --orphan data && git rm -rf -q . && cp /tmp/out/* . 
          printf "# Research data\nBinance spot 5m candles (public). Refreshed monthly by .github/workflows/fetch-data.yml.\n" > README.md
          git add -A && git commit -qm "data: $(date -u +%F)" && git push -f origin data
